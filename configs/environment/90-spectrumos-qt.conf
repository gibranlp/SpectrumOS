QT_STYLE_OVERRIDE=kvantum
# qt6ct's platform-theme plugin registers under both "qt6ct" and "qt5ct" (confirmed via
# its embedded Qt plugin metadata), so this single value is read by qt5ct's own plugin for
# Qt5 apps and by qt6ct's plugin for Qt6 apps -- there is no separate "qt6ct" value needed.
QT_QPA_PLATFORMTHEME=qt5ct
