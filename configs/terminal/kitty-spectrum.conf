# Kitty permite mantener los colores generados separados de los ajustes del usuario.
include ~/.cache/spectrumos/theme/current/kitty.conf

# Hyprland acomoda cada ventana; restaurar el estado maximizado puede tapar las demás.
remember_window_size no

map ctrl+c copy_to_clipboard
map ctrl+v paste_from_clipboard
map ctrl+shift+c send_key ctrl+c
