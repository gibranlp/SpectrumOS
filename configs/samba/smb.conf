[global]
    workgroup = WORKGROUP
    server string = SpectrumOS
    server role = standalone server
    security = user
    map to guest = never

    printing = cups
    printcap name = cups
    load printers = no

    usershare path = /var/lib/samba/usershares
    usershare max shares = 20
    usershare allow guests = no
    usershare owner only = yes

    log file = /var/log/samba/%m.log
    max log size = 1000
