# Installed for any nvidia/nvidia-intel/nvidia-amd GPU profile. Without this,
# resuming a laptop from suspend with the nvidia driver active is a well-known
# source of hangs or a corrupted GPU state; this preserves VRAM contents across
# the suspend/resume cycle instead of relying on the (less reliable) default.
options nvidia NVreg_PreserveVideoMemoryAllocations=1
