# Shared slug=display-label registry for the monospace font picker. The single source of
# truth for which slugs exist and their picker label -- font-family-menu (the Wofi/Eww
# picker) and system-adapter (the Overview status label) both read this instead of each
# keeping their own copy, which had drifted into three independent hand-maintained copies
# (this one, plus a bash copy, plus a Python copy) all commented "must match exactly".
#
# This does NOT replace FONT_FAMILIES in packages/spectrum-theme/src/spectrum_theme/cli.py
# -- that is a different mapping (slug to the actual Nerd Font family string renderers
# write into configs), owned by the theme engine's own package boundary. Keys here must
# still match its keys exactly, or a valid picker choice would render as nothing.
jetbrains-mono=JetBrains Mono
fira-code=Fira Code
source-code-pro=Source Code Pro
cascadia-code=Cascadia Code
hack=Hack
ibm-plex-mono=IBM Plex Mono
iosevka=Iosevka
victor-mono=Victor Mono
ubuntu-mono=Ubuntu Mono
meslo=Meslo
